[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atalla-sim"
version = "0.2.0"
description = "Cycle-accurate simulator for the Atalla accelerator"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest>=7"]
plots = ["matplotlib"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
# The source tree uses implicit namespace packages (no __init__.py outside
# base/ and native/), so plain find_packages would only pick up those two.
where = ["src"]
namespaces = true
exclude = ["*.__pycache__*"]

[tool.pytest.ini_options]
# Makes src/ importable without the per-file sys.path preamble the tests used
# to carry. Requires pytest >= 7.
pythonpath = ["src"]
testpaths = ["tests"]
# The hour-long 1024x1024 GEMM is left out by default: run it with `pytest -m slow`.
addopts = "-m 'not slow'"
markers = [
    "slow: takes about an hour; run with pytest -m slow",
    "golden: compares against the functional sim; skipped when its submodule is missing (tests/conftest.py)",
]
